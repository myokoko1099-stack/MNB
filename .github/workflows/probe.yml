name: Extraction probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe/**'
      - '.github/workflows/probe.yml'
      - 'app/src/main/java/com/mnb/browser/extraction/ExtractionScript.kt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - name: Probe noveldex
        run: node probe/probe.js
        continue-on-error: true
        env:
          PROBE_URL: https://noveldex.io/series/novel/my-girlfriend-is-already-fully-trained/chapter/2
          PROBE_OUT: probe-results/result.json
      - name: Probe novelpia
        run: node probe/probe.js
        continue-on-error: true
        env:
          PROBE_URL: https://global.novelpia.com/viewer/712724
          PROBE_OUT: probe-results/novelpia.json
      - name: Commit results
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-results
          git diff --cached --quiet || git commit -m "Probe results"
          git pull --rebase origin ${{ github.ref_name }}
          git push
